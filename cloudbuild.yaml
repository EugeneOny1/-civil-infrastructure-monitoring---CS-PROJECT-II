# ==============================================================================
# Google Cloud Build Pipeline: InfraVision on Cloud Run
# ==============================================================================
steps:
  # 1. Build container image with commit SHA and latest tags
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/infravision:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/infravision:latest'
      - '.'
    id: 'build-image'

  # 2. Push image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/infravision:$COMMIT_SHA'
    id: 'push-image'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'infravision'
      - '--image'
      - 'gcr.io/$PROJECT_ID/infravision:$COMMIT_SHA'
      - '--region'
      - '${_DEPLOY_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--concurrency'
      - '4'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300s'
      - '--execution-environment'
      - 'gen2'
      - '--cpu-boost'
      - '--port'
      - '8080'
    id: 'deploy-cloud-run'

substitutions:
  _DEPLOY_REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/infravision:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/infravision:latest'

options:
  logging: CLOUD_LOGGING_ONLY
